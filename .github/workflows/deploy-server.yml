name: Deploy Automático para Servidor Web (FTP/cPanel)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy no Servidor
    runs-on: ubuntu-latest
    # Executa apenas se os segredos de servidor estiverem configurados no GitHub
    if: ${{ vars.ENABLE_SERVER_DEPLOY == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências e gerar Build
        run: |
          npm ci || npm install
          npm run build

      - name: Sincronizar arquivos com o Servidor via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          local-dir: './dist/'
